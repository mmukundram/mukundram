<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mukundram</title>
  <meta name="description" content="Personal home base — a hub for my mini-sites and experiments." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />

  <!-- Anti-flash: set the saved theme before first paint. Key must match
       STORAGE_KEY in config/themes.config.js. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("site-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/themes.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
</head>

<body>
  <header id="site-header"></header>

  <main class="container">
    <section id="hero" class="hero"><!-- rendered by hub.js --></section>
    <section id="minisites" class="card-grid" aria-label="Mini-sites"><!-- rendered by hub.js --></section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="assets/js/hub.js"></script>
</body>

</html>
